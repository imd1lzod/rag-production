services:
  - type: web
    name: production-langgraph-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "20/minute"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: MAX_RETRIES
        value: "3"
      - key: PRIMARY_MODEL
        value: "gemini-3.1-flash-lite"
      - key: FALLBACK_MODEL
        value: "gemini-3.1-flash"
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false 
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: production-api
    healthCheckPath: /health
    autoDeploy: true